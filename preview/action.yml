name: "Moodle Playground preview link"
description: >-
  Build a playground URL that boots this pull request's plugin code. Outputs
  the URL; posting it is the caller's job, so this action needs no token and
  no write permission.
inputs:
  head-repo:
    description: "owner/repo the PR's code lives in (use github.event.pull_request.head.repo.full_name — NOT github.repository, which is wrong for forks)"
    required: true
  head-sha:
    description: "Full 40-character commit SHA to preview (use github.event.pull_request.head.sha — github.sha is the MERGE commit and appears in no commit list)"
    required: true
  pr-number:
    description: "PR number, shown in the review course name so the reviewer can confirm what they are looking at"
    required: false
    default: ""
  plugin-type:
    description: "Moodle plugin type (mod, block, theme, …). Inferred from a moodle-TYPE_NAME repo name when omitted."
    required: false
    default: ""
  plugin-name:
    description: "Plugin name without the type prefix. Inferred from a moodle-TYPE_NAME repo name when omitted."
    required: false
    default: ""
  plugin-component:
    description: >-
      Frankenstyle component (e.g. mod_coursework), stating the plugin's
      identity outright. Beats both version.php and the repository name. Needed
      when nothing is checked out and the repo is named unconventionally;
      leave empty otherwise.
    required: false
    default: ""
  landing-path:
    description: >-
      Site-relative path the reviewer lands on, overriding the per-plugin-type
      default (e.g. /course/view.php?id=2). Must start with "/" and carry no
      scheme — a link that lands the reviewer on another origin is refused.
    required: false
    default: ""
  built-by:
    description: >-
      Short plain-text note shown in the review course name, e.g.
      "dispatch · alice · 2026-08-07". For links built by hand this is the only
      provenance the reviewer gets: a dispatch-built link is otherwise
      shape-identical to one born from a push, and nothing booted it.
    required: false
    default: ""
  php-version:
    description: >-
      PHP to boot, e.g. 8.2. Must be one the chosen moodle-branch accepts
      (4.x takes 8.1-8.3, 5.x takes 8.2-8.4) — an invalid pair is REFUSED
      rather than silently substituted, which is what the playground would
      otherwise do. Blank, or the reserved token "(default)", means the
      default for the branch — a choice input cannot be left blank, so the
      dispatch form sends the token instead.
    required: false
    default: ""
  login-as:
    description: >-
      Account the reviewer arrives as: admin, teacher, teacher2 (only when
      `teachers` is 2), or student1..studentN.
      Blank, or the reserved token "(default)", derives it from the
      landing page (admin for admin pages, teacher
      elsewhere), which is right for most reviews but cannot know you want to
      see the plugin as a learner.
    required: false
    default: ""
  teachers:
    description: >-
      How many EDITING teachers the review course gets: 1 (default), 0 or 2.

      0 creates none, and the reviewer then arrives as `admin` — who can open
      anything, so it is NOT what a teacher-less site looks like to a teacher.
      Capability checks a plugin's own code relies on are bypassed by an
      administrator. Use `login-as: student1` for a capability-honest view.

      2 adds `teacher2`, also an editing teacher. Moodle's non-editing teacher
      role is a strict subset of the editing one — it cannot add an activity —
      so a second teacher that could not edit would read as a broken plugin.
    required: false
    default: "1"
  students:
    description: >-
      How many student accounts the review course gets (1-20, default 1).
      More matter for anything that lists, groups or grades people. Measured
      at roughly 280ms for 20.
    required: false
    default: "1"
  sections:
    description: "How many sections the review course has (1-20, default 3)."
    required: false
    default: "3"
  courses:
    description: >-
      How many courses the review site has: 1 (default), 2 or 3. The review
      course is always the first one created, because the activity add form the
      reviewer lands on names a course by NUMBER and Moodle allocates those in
      creation order — the preview proves that before you arrive.

      The extras are `REVIEW2` and `REVIEW3`, in their own category. You are
      enrolled in `REVIEW2` but deliberately NOT in `REVIEW3`: with every course
      enrolled, `enrol_get_my_courses()` and `get_courses()` return the same
      rows, so a plugin that ignores enrolment looks exactly like one that
      honours it. The empty course is what makes the difference visible.

      Extras inherit the chosen course format and section count explicitly —
      left to the handler's defaults they would come out as topics courses with
      five sections, and the reviewer would be comparing courses that differ in
      a way nobody chose.
    required: false
    default: "1"
  language-packs:
    description: >-
      Extra Moodle language packs to install, comma separated (e.g. `es` or
      `es,ar`). Up to 3, and the FIRST becomes the site language — installing
      one without selecting it changes almost nothing a reviewer would notice.

      The stated use is seeing a plugin render right-to-left: pass `ar`. A
      language pack does NOT surface hardcoded English in a plugin's own code;
      strings the pack has not translated fall back to English, which is normal
      Moodle behaviour and looks identical to a half-finished download.

      REFUSED rather than dropped when a code is malformed, repeated, or `en`
      (English is built in and is not a downloadable pack). The install step
      itself CANNOT fail — its PHP and its JavaScript each swallow every error —
      so a pack that does not download would otherwise leave a working English
      site and a green boot log. The preview proves in-band that each pack is
      really installed and that the site is really speaking the first one.
    required: false
    default: ""
  course-format:
    description: >-
      Course format for the review course: topics (the default), weeks, social
      or singleactivity. Blank, or the reserved token "(default)", means topics.

      REFUSED rather than substituted when the value is not one of those four.
      Moodle does not validate a course format: `create_course()` stores the
      string verbatim and `/course/view.php` then renders the site default
      instead, with no error, no notice and nothing in the boot log — so a typo
      here would produce a healthy-looking ordinary course and the reviewer
      would never know the setting was ignored. The preview also proves in-band
      that the format really took effect before the reviewer arrives.

      Not for use when the plugin under review IS a course format: the review
      course already uses it, and setting this as well is refused rather than
      silently replacing it. Refused alongside a course backup too, since a
      restored course brings its own format and this preview does not create it.

      `singleactivity` shows one activity and hides the course page, including
      the preview's own review brief; the landing page compensates.
    required: false
    default: ""
  plugin-root:
    description: >-
      Directory holding the plugin's version.php, relative to the workspace.
      When present it is the authority on the plugin's component and on which
      Moodle it needs, and the action REFUSES to build a link for a plugin the
      playground cannot run. Absent (e.g. previewing a plugin you did not check
      out) the check is skipped and said so out loud. version.php is parsed,
      never executed.
    required: false
    default: "."
  moodle-branch:
    description: >-
      Which Moodle the playground will boot, used to check the plugin's
      $plugin->requires. Must match the playground's own default, which is
      MOODLE_500_STABLE. The link does not yet pin this (see README).
    required: false
    default: "MOODLE_500_STABLE"
  sample-content:
    description: >-
      Put a ready-made review course into the preview. "review-course" restores
      a sample course with ten ordinary Moodle activities in it, so a reviewer
      sees a realistic site rather than an empty one. Left at "(default)" the
      preview builds its own small course. Use restore-course-url instead if
      you want to supply your own backup.
    required: false
    default: "(default)"
  restore-course-url:
    description: >-
      A Moodle course backup (.mbz) to restore as the review course, instead of
      building an empty one. Must be on an allowed data host. It is fetched and
      inspected when the LINK is built, so a wrong file is refused with a
      readable reason — restoreCourse itself cannot report a content failure,
      and a failed restore otherwise leaves a working-looking site with an
      empty course.
    required: false
    default: ""
  extra-plugins:
    description: >-
      Other plugins to install alongside the one under review, comma separated,
      each written owner/repo@ref#type_name — for example
      ucl-isd/moodle-local_sitsgradepush@main#local_sitsgradepush. Up to five.

      Every part is required. Without #type_name nothing can name what is being
      installed, and a ZIP declaring itself to be one of Moodle's own plugins is
      written over Moodle's copy file by file. Without @ref the preview would
      boot whatever that branch points at on the day it is opened, which is not
      what the link claims and 404s once the branch is deleted; a branch or tag
      name is resolved to a commit before the link is built.

      Each one is checked when the LINK is built: the commit must exist, the
      archive must exist, and its version.php must declare the component named
      here and run on the chosen Moodle. Dependencies are read from the same
      file and INSTALLED FIRST — Moodle enforces none of that during a scripted
      install, so a missing dependency would otherwise install quietly and fail
      later, in front of the reviewer.
    required: false
    default: ""
  theme:
    description: >-
      Look at the plugin under a real theme instead of stock Boost. ONE theme,
      written owner/repo@ref#theme_name — for example
      moodle-an-hochschulen/moodle-theme_boost_union@MOODLE_500_STABLE#theme_boost_union.
      Leave blank for Boost.

      Not needed when the plugin under review IS a theme: the preview already
      switches to it, and filling this box as well is refused rather than
      silently overriding it, because only one theme can be active.

      The repository must be PUBLIC. The reviewer's browser downloads the
      archive with no credentials, so a private institutional theme cannot be
      previewed here at all.

      Checked when the link is built: the commit and archive must exist, the
      component must be a theme and not one of Moodle's own, and its config.php
      must set $THEME->parents — a theme that does not is not a theme to
      Moodle, and would render stock Boost with nothing in the log. The
      preview then proves the theme is really active before you arrive.
    required: false
    default: ""
  restore-database-url:
    description: >-
      Restore a WHOLE DATABASE before anything else runs — a real site's
      courses, users and content, instead of the empty Moodle this preview
      otherwise builds. The address of a .sq3 file produced by mchef's
      `playground --snapshot` export. A dump from a standard MySQL or
      PostgreSQL Moodle will not work: the playground runs SQLite with its own
      driver patches, and the export is what converts it.

      It does NOT have to live in a git repository — any address your
      `data-hosts` allows will do — which is why the digest below is required
      rather than optional.

      The file is downloaded and OPENED when the link is built, because that is
      the only place anything can be checked. `restoreDatabase` renames the
      downloaded file over the live database and verifies nothing, and a
      failure that happens after that rename cannot abort the step — the
      playground's own comment says "aborting cannot undo the swap" — so a
      half-restored site reports a SUCCESSFUL step. Building the link therefore
      refuses a snapshot that is not a SQLite database, has no site identity,
      carries a script in one of Moodle's raw-HTML settings, holds a course or
      an account this preview also creates, or comes from a different Moodle
      than the one you are booting.

      That last one matters more than it sounds: the restore seeds Moodle's
      version hash to the RUNNING code, so Moodle can never again notice the
      mismatch. There is no upgrade screen and no warning — the site comes up
      looking fine and then fails with a database error on whichever page needs
      a column the other version has.

      The reviewer's browser downloads this file itself, so the host must be
      public and must allow cross-origin reads.
    required: false
    default: ""
  restore-database-sha256:
    description: >-
      The sha256 of the file at restore-database-url. REQUIRED whenever that
      box is filled. Get it with `curl -sL <url> | sha256sum`.

      Every other address this action takes is pinned to a commit, so it can
      only ever mean one file. A database snapshot is data and may be published
      anywhere, so this digest is the only record of WHICH file the link was
      built against.

      It is checked at BUILD time, against the bytes that were downloaded and
      inspected. It is NOT re-checked in the reviewer's browser and cannot be:
      the restore rewrites the file's wwwroot, dataroot and version hash before
      any code of ours could run, so the installed database no longer hashes to
      the snapshot. What covers the reviewer's copy instead is the site
      identity, which the restore leaves alone and the preview asserts in the
      browser after the swap.
    required: false
    default: ""
  data-hosts:
    description: >-
      Comma-separated hosts that URLs inside the blueprint may point at —
      plugin ZIPs, and anything else it fetches. Defaults to
      "github.com,raw.githubusercontent.com". Extra plugins and themes are
      GitHub-only whatever this says, because their address is a GitHub
      coordinate; widen it for a URL you paste in full, such as a course
      backup on a university host.

      What protects the central claim when you widen this is NOT this input:
      it is that two plugin steps resolving to the same directory are refused
      outright. Without that, a second plugin sharing your plugin's type and
      name would extract over the top of it file by file, and the page would
      still be headed with your commit. That check runs whatever this is set
      to. What this input controls is only where the OTHER plugins may come
      from.
    required: false
    default: "github.com,raw.githubusercontent.com"
  playground-host:
    description: >-
      Playground to open. Defaults to the fork we control, because
      moodle-playground.com is a third party's deployment that can change
      without notice and is missing restoreDatabase — a link built for a step
      the target host lacks fails SILENTLY, booting a Moodle without it.

      KNOWN TRADE-OFF, deliberate and temporary: a preview runs unreviewed
      pull-request PHP in the visitor's browser, in an unsandboxed iframe with
      a persistent service worker, and browser isolation is per-DOMAIN, not
      per-path. So this default shares an origin with anything else published
      under daviducl.github.io, including mchef-urls. Acceptable while the
      people clicking are previewing their own plugins; NOT acceptable once
      third-party pull requests run through it. The fix is a dedicated origin
      (a separate free GitHub account or org — Pages project sites all share
      one origin per account, so a second repo achieves nothing), scheduled
      for immediately before go-live.
    required: false
    default: "https://daviducl.github.io/moodle-playground"
outputs:
  preview-url:
    description: "The URL to put on the pull request"
    value: ${{ steps.build.outputs.preview-url }}
  plugin-component:
    description: "Frankenstyle component, from version.php when available"
    value: ${{ steps.build.outputs.plugin-component }}
  preview-user:
    description: "Username the reviewer arrives signed in as"
    value: ${{ steps.build.outputs.preview-user }}
  risky-steps:
    description: "Comma-separated steps in the blueprint that can rewrite Moodle after installing (empty for an ordinary preview)"
    value: ${{ steps.build.outputs.risky-steps }}
  plugin-type:
    description: "Resolved plugin type"
    value: ${{ steps.build.outputs.plugin-type }}
  plugin-name:
    description: "Resolved plugin name"
    value: ${{ steps.build.outputs.plugin-name }}
  head-sha:
    description: "The commit the link previews (echoed back for the caller's comment)"
    value: ${{ steps.build.outputs.head-sha }}
  comment-body:
    description: >-
      Ready-to-post markdown for the pull request. Rendered here rather than in
      the caller's workflow so a wording or safety fix reaches every adopter on
      a version bump, instead of forking once per repo.
    value: ${{ steps.comment.outputs.comment-body }}
runs:
  using: "composite"
  steps:
    - name: Refuse pull_request_target
      shell: bash
      run: |
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; then
          echo "::error::never run this on pull_request_target"
          exit 1
        fi

    - name: Build preview URL
      id: build
      shell: bash
      env:
        HEAD_REPO: ${{ inputs.head-repo }}
        HEAD_SHA: ${{ inputs.head-sha }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PLUGIN_TYPE: ${{ inputs.plugin-type }}
        PLUGIN_NAME: ${{ inputs.plugin-name }}
        PLAYGROUND_HOST: ${{ inputs.playground-host }}
        PLUGIN_ROOT: ${{ inputs.plugin-root }}
        PLUGIN_COMPONENT: ${{ inputs.plugin-component }}
        LANDING_PATH: ${{ inputs.landing-path }}
        BUILT_BY: ${{ inputs.built-by }}
        PHP_VERSION: ${{ inputs.php-version }}
        LOGIN_AS: ${{ inputs.login-as }}
        TEACHERS: ${{ inputs.teachers }}
        STUDENTS: ${{ inputs.students }}
        SECTIONS: ${{ inputs.sections }}
        COURSE_FORMAT: ${{ inputs.course-format }}
        COURSES: ${{ inputs.courses }}
        LANGUAGE_PACKS: ${{ inputs.language-packs }}
        SAMPLE_CONTENT: ${{ inputs.sample-content }}
        RESTORE_COURSE_URL: ${{ inputs.restore-course-url }}
        EXTRA_PLUGINS: ${{ inputs.extra-plugins }}
        THEME: ${{ inputs.theme }}
        RESTORE_DATABASE_URL: ${{ inputs.restore-database-url }}
        RESTORE_DATABASE_SHA256: ${{ inputs.restore-database-sha256 }}
        DATA_HOSTS: ${{ inputs.data-hosts }}
        MOODLE_BRANCH: ${{ inputs.moodle-branch }}
        OUT_DIR: ${{ runner.temp }}/preview-out
      run: |
        # ubuntu-latest has node on PATH; self-hosted runners often do not
        # (the runner bundles its own under externals/ without exporting it).
        command -v node >/dev/null || { echo "::error::node >= 18 must be on PATH"; exit 1; }
        # `preview/` is not standalone: it runs a script from the repo root.
        # Fail loudly rather than executing whatever happens to sit at `..`
        # if someone vendors this directory on its own.
        root="$GITHUB_ACTION_PATH/.."
        if [ ! -f "$root/scripts/preflight.mjs" ]; then
          echo "::error::preview/ must be used from its own repo (owner/repo/preview@sha), not vendored alone"
          exit 1
        fi
        node "$root/scripts/build-preview.mjs"

    - name: Render the comment body
      id: comment
      # always(): a failed build still needs a body, so the caller can replace
      # a stale link rather than leave an older commit's preview looking current.
      if: always()
      shell: bash
      env:
        PREVIEW_URL: ${{ steps.build.outputs.preview-url }}
        PLUGIN: ${{ steps.build.outputs.plugin-type }}_${{ steps.build.outputs.plugin-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        PREVIEW_USER: ${{ steps.build.outputs.preview-user }}
        RISKY_STEPS: ${{ steps.build.outputs.risky-steps }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$GITHUB_ACTION_PATH/../scripts/render-comment.mjs"
