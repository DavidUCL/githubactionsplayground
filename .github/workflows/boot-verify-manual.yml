name: boot-verify (manual)

on:
  workflow_dispatch:
    inputs:
      blueprint-url:
        description: >-
          RAW blueprint URL, e.g.
          https://raw.githubusercontent.com/OWNER/REPO/REF/blueprints/x.json
          — NOT the github.com page URL (use the file's "Raw" button). Only
          raw.githubusercontent.com is allowed by default. Prefilled with a
          known-good blueprint, so running this unchanged is a smoke test of
          the action itself.
        required: true
        default: "https://raw.githubusercontent.com/DavidUCL/mchef-urls/a354757fde7c28aedafc9a8e6fd99d5f828a7359/blueprints/integration-test.json"
        type: string
      playground-host:
        description: >-
          Which playground to boot in. The default tracks the current
          blueprint schema; moodle-playground.com runs an older build that
          silently substitutes its own starter blueprint for anything it
          cannot parse (you get verify_fail / resolver_fallback).
        required: false
        default: "https://daviducl.github.io/moodle-playground"
        type: string
      timeout-seconds:
        description: >-
          How long to let the browser run before giving up, in seconds
          (420 = 7 minutes). Running out is reported as a timeout, not as a
          fault in the blueprint.
        required: false
        default: "420"
        type: string
      blueprint-hosts:
        description: >-
          Which hosts the blueprint URL itself may come from, comma
          separated. Widen this to verify a blueprint hosted somewhere other
          than raw.githubusercontent.com.
        required: false
        default: "raw.githubusercontent.com"
        type: string
      data-hosts:
        description: >-
          Which hosts the URLs INSIDE the blueprint may point at (plugin
          ZIPs, database snapshots), comma separated. A blueprint pulling
          from anywhere else is refused before the browser starts.
        required: false
        default: "raw.githubusercontent.com"
        type: string
      accepted-origins:
        description: >-
          Extra origins the boot may legitimately finish on, comma separated.
          Only needed when the playground host redirects elsewhere — e.g.
          moodle-playground.com lands on ateeducacion.github.io. The
          playground host's own origin is always accepted.
        required: false
        default: "https://ateeducacion.github.io"
        type: string
  # Phase 2 (design §8): uncomment to run automatically on same-repo PRs.
  #
  # ⚠ TRUST INVERSION — read before uncommenting. This workflow
  # runs `uses: ./`, i.e. the action code FROM THE CHECKOUT. Under
  # `pull_request` from a fork, that code is the PR's: it can delete the
  # pull_request_target refusal, rewrite assert.mjs to emit `pass`, or add a
  # lifecycle script. Every control in this repo is bypassable in exactly the
  # mode phase 2 turns on — the only thing that survives is `permissions: {}`
  # and no secrets, which limits the damage to a green check that means
  # nothing. Before phase 2: consume the action as `owner/repo@<sha>` so the
  # verifier is pinned code the PR cannot edit.
  #
  # Entry gate also required: one green SHA-pinned consumer run from a real
  # plugin repo. NEVER change this to pull_request_target.
  # pull_request:
  #   types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: boot-verify-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@v5

      - name: Boot verify
        id: verify
        uses: ./
        with:
          blueprint-url: ${{ inputs.blueprint-url }}
          playground-host: ${{ inputs.playground-host }}
          timeout-seconds: ${{ inputs.timeout-seconds }}
          blueprint-hosts: ${{ inputs.blueprint-hosts }}
          data-hosts: ${{ inputs.data-hosts }}
          accepted-origins: ${{ inputs.accepted-origins }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: boot-verify-evidence
          path: boot-verify-out/
          if-no-files-found: warn

      - name: Gate
        env:
          STATUS: ${{ steps.verify.outputs.status }}
          ERROR_CLASS: ${{ steps.verify.outputs.error-class }}
        run: |
          echo "status=$STATUS error_class=$ERROR_CLASS"
          [ "$STATUS" = "pass" ]
