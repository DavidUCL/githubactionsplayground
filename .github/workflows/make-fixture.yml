# Cut the review course fixture, and open a pull request committing it.
#
# The point is that regenerating the .mbz is a REVIEWABLE DIFF produced by
# checked-in code, not a binary someone made on their laptop. `fixtures/seed.php`
# is the source of truth; this workflow only runs it.
#
# WHY THE VERIFICATION RUNS HERE RATHER THAN ON THE PULL REQUEST.
# GitHub's docs: when a workflow using GITHUB_TOKEN creates a pull request, the
# resulting `pull_request` event "creates workflow runs in an approval-required
# state" — they sit greyed behind an "Approve workflows to run" banner, which a
# reviewer can merge straight past. That is worse than a red X. So this run
# verifies its own output BEFORE opening the PR, and puts the verification in
# the PR body as the record.
#
# WHY 4.4 AND WHY A TAG.
# Cut on the OLDEST branch offered: restoring forward is safe, restoring
# backward fails SILENTLY (set_missing_modules drops unknown activity types with
# no error). The tag is pinned rather than tracking MOODLE_404_STABLE so the cut
# is reproducible, and it sits just behind the bundle the playground boots
# (4.4.12+), which is the safe direction.
#
# Dispatch-only, never scheduled: every run adds a binary to history.

name: make-fixture

on:
  workflow_dispatch:
    inputs:
      moodle-tag:
        description: "Moodle tag to cut the fixture on. Must be <= the release the 4.4 bundle runs (check 1h reports it)."
        required: false
        default: "v4.4.12"

permissions:
  contents: read

jobs:
  cut:
    name: seed a course and cut it to .mbz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # No pull-requests: write — this job pushes a branch and hands over a
      # link; it deliberately does not open the PR itself (see below).
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Check out the action
        uses: actions/checkout@v5
        with:
          path: action

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Moodle 4.4 requires PHP >= 8.1 and declares 8.4 unsupported
      # (admin/environment.xml, RESTRICT restrict_php_version_84). Check 1n
      # enforces the same bounds on the action's own tables.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pgsql, gd, intl, mbstring, curl, zip, xml, soap, exif, opcache
          # max_input_vars: Moodle's environment check REFUSES to install below
          # 5000 ("this test must pass"), and the runner's default is 1000 — the
          # first dispatch died here. memory_limit: a course backup builds its
          # plan in memory and the runner default is not generous.
          ini-values: max_input_vars=5000, memory_limit=512M

      - name: Check out Moodle at the pinned tag
        env:
          MOODLE_TAG: ${{ inputs.moodle-tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$MOODLE_TAG" \
            https://github.com/moodle/moodle.git moodle
          echo "moodle at $(git -C moodle describe --tags --always)"

      - name: Install Moodle
        run: |
          set -euo pipefail
          sudo mkdir -p /var/moodledata && sudo chmod 777 /var/moodledata
          php moodle/admin/cli/install.php \
            --non-interactive --agree-license \
            --wwwroot=http://localhost \
            --dataroot=/var/moodledata \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbname=moodle \
            --dbuser=moodle --dbpass=moodle \
            --fullname="Fixture cutter" --shortname="fixture" \
            --adminuser=admin --adminpass="Fixture!1234" --adminemail=fixture@example.invalid
          echo "installed: $(php -r 'require "moodle/version.php"; echo $release;')"

      - name: Seed the course and cut the backup
        run: |
          set -euo pipefail
          mkdir -p out
          php action/fixtures/seed.php "$PWD/moodle" "$PWD/out/review-course-MOODLE_404_STABLE.mbz"

      # The honesty proof. Our OWN reader, against the spec the seed script read
      # — so "what was asked for" and "what came out" are compared by code, not
      # by eye.
      - name: Verify the fixture matches the spec
        run: |
          set -euo pipefail
          node action/scripts/check-fixture.mjs \
            out/review-course-MOODLE_404_STABLE.mbz \
            action/fixtures/fixture-spec.json | tee out/verification.txt

      # Push the branch and let a HUMAN open the pull request.
      #
      # Two reasons, and the second is the better one:
      #
      #  1. `gh pr create` is refused outright unless the repo enables "Allow
      #     GitHub Actions to create and approve pull requests", which is off by
      #     default. Measured: "GitHub Actions is not permitted to create or
      #     approve pull requests (createPullRequest)".
      #  2. Even with it enabled, a PR opened by GITHUB_TOKEN gets
      #     APPROVAL-REQUIRED checks — they sit greyed behind a banner a
      #     reviewer can merge past. A PR opened by a person gets its checks run
      #     normally. So the setting is not worth enabling: handing over a
      #     branch is strictly better than handing over a PR whose checks are
      #     asleep.
      #
      # The verification has already run above, in this job, and is repeated
      # into the summary so the branch arrives with its evidence attached.
      - name: Push the branch and hand over the PR link
        env:
          MOODLE_TAG: ${{ inputs.moodle-tag }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        working-directory: action
        run: |
          set -euo pipefail
          BRANCH="fixture/review-course-$(date -u +%Y%m%d-%H%M%S)"
          cp ../out/review-course-MOODLE_404_STABLE.mbz fixtures/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add fixtures/review-course-MOODLE_404_STABLE.mbz
          if git diff --cached --quiet; then
            echo "::notice::the regenerated fixture is byte-identical to the one on main; nothing to open"
            {
              echo "## Fixture unchanged"
              echo
              echo "Regenerating produced a byte-identical file. Nothing to merge."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Regenerate the review course fixture"
          git push origin "$BRANCH"
          {
            echo "## Review course fixture regenerated"
            echo
            echo "Cut by \`fixtures/seed.php\` from Moodle \`$MOODLE_TAG\`, and verified"
            echo "in this run — a PR opened by Actions would carry approval-required"
            echo "checks that a reviewer can merge past, so the branch is handed over"
            echo "for a person to open:"
            echo
            echo "**$SERVER_URL/$REPO/compare/$BRANCH?expand=1**"
            echo
            echo '```'
            cat ../out/verification.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::open the PR here: $SERVER_URL/$REPO/compare/$BRANCH?expand=1"

      - name: Upload the fixture as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-course-fixture
          path: out/
          if-no-files-found: warn
          retention-days: 14
