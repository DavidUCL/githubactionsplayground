# Build a preview link for any public Moodle plugin, by hand.
#
# Actions -> "Preview a plugin" -> Run workflow. Nothing is pushed, nothing is
# commented, no repo is modified: the link appears in the run summary.
#
# WHY THIS IS A SEPARATE WORKFLOW from "Preview a blueprint". A dispatch form
# has no conditional visibility — every field shows whatever you pick — so a
# single form with a "source" selector would show eight irrelevant boxes. The
# Actions sidebar is the selector, for free.
#
# NINE FIELDS. A review panel cut an earlier draft to five; David restored
# `login-as`, the counts, and `php-version` — the last one restricted to the
# versions each Moodle branch actually accepts, and REFUSED rather than
# silently substituted when the pair is invalid, which is what the playground
# would otherwise do. Every control is still a failure surface: blueprint
# failure is invisible in this runtime, so each one is validated before a link
# is built rather than discovered in the reviewer's browser.

name: Preview a plugin

on:
  workflow_dispatch:
    inputs:
      plugin-repo:
        description: "Public repo holding the plugin, e.g. ucl-isd/moodle-mod_coursework"
        required: true
        type: string
      plugin-ref:
        description: "Branch, tag or full SHA. Resolved to a SHA before the link is built. Blank = default branch."
        required: false
        type: string
        default: ""
      moodle-branch:
        description: "Which Moodle to boot. Only branches whose compatibility data we hold."
        required: false
        type: choice
        default: MOODLE_500_STABLE
        options:
          - MOODLE_500_STABLE
          - MOODLE_405_STABLE
          - MOODLE_404_STABLE
      restore-course-url:
        description: >-
          Fill the preview with a real course instead of an empty one. Paste the
          address of a Moodle course backup (.mbz). It is downloaded and checked
          when the link is built, so a wrong file is refused with a reason
          rather than booting a Moodle with nothing in it. Leave blank for an
          empty course.
        required: false
        default: ""
      landing-path:
        description: "Optional: site-relative page to land on, e.g. /course/view.php?id=2. Blank = the default for the plugin type."
        required: false
        type: string
        default: ""
      plugin-component:
        description: "Optional: force the component, e.g. mod_coursework. Blank = read from the plugin's own version.php."
        required: false
        type: string
        default: ""
      php-version:
        description: "PHP to boot. Leave as (default) to let the branch decide. Must be one the chosen Moodle accepts — 4.x takes 8.1-8.3, 5.x takes 8.2-8.4. An invalid pair is refused, not substituted."
        required: false
        type: choice
        default: "(default)"
        options:
          - "(default)"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
      login-as:
        description: "Who you arrive as. Leave as (default) to derive it from the landing page; pick a student to see the plugin as a learner."
        required: false
        type: choice
        default: "(default)"
        options:
          - "(default)"
          - admin
          - teacher
          - student1
          - student2
          - student3
      students:
        description: "Student accounts in the review course. Raise it for anything that lists, groups or grades people."
        required: false
        type: choice
        default: "1"
        options: ["1", "2", "3", "5", "10", "20"]
      sections:
        description: "Sections in the review course."
        required: false
        type: choice
        default: "3"
        options: ["1", "3", "5", "10"]

# `contents: read`, not `{}`. The ref lookup calls `gh api` against a public
# repo, and with no scopes at all that call fails — proven by dispatching this
# workflow twice and watching both runs die before building anything. Nothing
# here writes.
permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Resolve whatever was typed to a SHA, so the link is pinned. A branch
      # link shows later commits and 404s once the branch is deleted — the
      # mutable pointer this whole design refuses. Done with `gh api`, not
      # `git ls-remote`, because ls-remote honours `--upload-pack=` and the ref
      # is typed by a human.
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.plugin-repo }}
          REF: ${{ inputs.plugin-ref }}
        run: |
          set -euo pipefail
          case "$REPO" in
            */*) : ;;
            *) echo "::error::plugin-repo must be owner/repo, got '$REPO'"; exit 1 ;;
          esac
          if [ -z "$REF" ]; then
            REF=$(gh api "repos/$REPO" --jq .default_branch)
            echo "::notice::no ref given; using the default branch $REF"
          fi
          # A full SHA resolves to itself; anything else is looked up.
          sha=$(gh api "repos/$REPO/commits/$REF" --jq .sha)
          # A counted glob of `?` is unreadable and was one short — 39 where 40
          # are needed — so it rejected every real SHA and the workflow could
          # never build a link. State the length instead of counting it.
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::could not resolve '$REF' in $REPO to a commit (got: ${sha:0:60})"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::$REPO@$REF -> $sha"

      - id: preview
        uses: ./preview
        with:
          head-repo: ${{ inputs.plugin-repo }}
          head-sha: ${{ steps.ref.outputs.sha }}
          moodle-branch: ${{ inputs.moodle-branch }}
          restore-course-url: ${{ inputs.restore-course-url }}
          landing-path: ${{ inputs.landing-path }}
          plugin-component: ${{ inputs.plugin-component }}
          # The two sentinel options mean "leave it to the action", which is
          # not the same as an empty string a user typed — a `choice` has no
          # unset state, so the sentinel is how "unset" is expressed.
          php-version: ${{ inputs.php-version }}
          login-as: ${{ inputs.login-as }}
          students: ${{ inputs.students }}
          sections: ${{ inputs.sections }}
          # The only provenance a pasted link carries. Without it, a link built
          # here is shape-identical to one born from a push — and nothing here
          # booted anything.
          built-by: dispatch · ${{ github.actor }}
          # Nothing is checked out for the plugin, so version.php is fetched
          # over https from the pinned SHA. Point plugin-root at a subdirectory
          # only if the plugin does not sit at the repo root.
          plugin-root: "."
