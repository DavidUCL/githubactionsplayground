# Dogfood: this repo posts a preview comment on its OWN pull requests.
#
# It exists because the posting step was the only untested component in the
# system — and the one that forks into every adopting repo. The marker filter,
# the bot-login assumption, the head-SHA race re-check and the multi-line
# output delimiter had never run anywhere. Now they run here, on every PR,
# before anyone else copies them.
#
# This is `examples/pr-preview-workflow.yml` with two differences:
#   - `uses: ./preview` instead of a SHA-pinned reference, because the action
#     and the workflow ship together here;
#   - it previews a fixed third-party plugin, since this repo is not a Moodle
#     plugin and has nothing of its own to install.
#
# NEVER change the trigger to pull_request_target: the action hard-fails on it,
# and under `uses: ./` the PR supplies the code that would run.

name: PR preview (dogfood)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Cancels superseded runs — but that is a request, not a guarantee. The
  # head-SHA re-check below is what actually stops an older commit's comment
  # landing last.
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PRs get a read-only token, so posting would 403. No fork previews,
    # by design — see examples/pr-preview-workflow.yml for why the obvious
    # fixes are worse.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5

      - id: preview
        uses: ./preview
        with:
          # This repo holds no Moodle plugin, so preview a real one at a fixed
          # commit. A plugin repo would pass its own head repo and SHA.
          head-repo: danmarsden/moodle-mod_attendance
          head-sha: 8b217b1807bc0d33b3ac3b50ba516a7aaa7f367c
          pr-number: ${{ github.event.pull_request.number }}

      - name: Comment the preview link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ steps.preview.outputs.comment-body }}
        run: |
          set -o pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::head moved to ${head:0:7}; not overwriting"
            exit 0
          fi
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]")
                      | select((.body // "") | contains("<!-- moodle-playground-preview -->")) | .id')
          id=${found%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi
