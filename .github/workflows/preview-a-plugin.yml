# Build a preview link for any public Moodle plugin, by hand.
#
# Actions -> "Preview a plugin" -> Run workflow. Nothing is pushed, nothing is
# commented, no repo is modified: the link appears in the run summary.
#
# WHY THIS IS A SEPARATE WORKFLOW from "Preview a blueprint". A dispatch form
# has no conditional visibility — every field shows whatever you pick — so a
# single form with a "source" selector would show eight irrelevant boxes. The
# Actions sidebar is the selector, for free.
#
# SIXTEEN FIELDS, of a planned twenty. A review panel cut an earlier draft to
# five; David restored `login-as`, the counts, and `php-version` — the last one
# restricted to the versions each Moodle branch actually accepts, and REFUSED
# rather than silently substituted when the pair is invalid, which is what the
# playground would otherwise do. Every control is still a failure surface:
# blueprint failure is invisible in this runtime, so each one is validated
# before a link is built rather than discovered in the reviewer's browser.
#
# Declaration order IS the layout — GitHub renders the fields in the order they
# appear here and gives no other grouping. Required first, then the ones that
# change what the reviewer sees, then the narrow ones.

name: Preview a plugin

on:
  workflow_dispatch:
    inputs:
      plugin-repo:
        description: "Public repo holding the plugin, e.g. ucl-isd/moodle-mod_coursework"
        required: true
        type: string
      plugin-ref:
        description: "Branch, tag or full SHA. Resolved to a SHA before the link is built. Blank = default branch."
        required: false
        type: string
        default: ""
      moodle-branch:
        description: "Which Moodle to boot. Only branches whose compatibility data we hold."
        required: false
        type: choice
        default: MOODLE_500_STABLE
        options:
          - MOODLE_500_STABLE
          - MOODLE_405_STABLE
          - MOODLE_404_STABLE
      sample-content:
        description: >-
          Put a ready-made course into the preview so it looks like a real site.
          "review-course" restores a sample course with ten ordinary activities.
          Leave as (default) for the small course the preview builds itself.
        required: false
        type: choice
        default: "(default)"
        options:
          - "(default)"
          - review-course
      restore-course-url:
        description: >-
          Fill the preview with a real course instead of an empty one. Paste the
          address of a Moodle course backup (.mbz). It is downloaded and checked
          when the link is built, so a wrong file is refused with a reason
          rather than booting a Moodle with nothing in it. Leave blank for an
          empty course.
        required: false
        default: ""
      extra-plugins:
        description: >-
          Other plugins this one needs, comma separated, each written
          owner/repo@ref#type_name (e.g.
          ucl-isd/moodle-local_sitsgradepush@main#local_sitsgradepush). Up to
          five. They are installed BEFORE the plugin under review, in dependency
          order. A plugin whose dependency is missing installs silently and
          fails later, so the reviewer sees a broken plugin instead of a missing
          one.
        required: false
        type: string
        default: ""
      theme:
        description: >-
          Look at the plugin under a real theme instead of stock Boost. ONE
          theme, written owner/repo@ref#theme_name (e.g.
          moodle-an-hochschulen/moodle-theme_boost_union@MOODLE_500_STABLE#theme_boost_union).
          Blank = Boost. Leave it blank when the plugin under review IS a theme;
          the preview already switches to it. The repository must be PUBLIC —
          the reviewer's browser downloads it with no credentials.
        required: false
        type: string
        default: ""
      data-hosts:
        description: >-
          Hosts the preview may download plugins from, comma separated. Blank
          means github.com,raw.githubusercontent.com. Extra plugins and themes
          are GitHub-only whatever this says — their address is a GitHub
          coordinate — so widen it only for a URL you paste in full, such as a
          course backup on a university host.
        required: false
        type: string
        default: ""
      landing-path:
        description: "Optional: site-relative page to land on, e.g. /course/view.php?id=2. Blank = the default for the plugin type."
        required: false
        type: string
        default: ""
      plugin-component:
        description: "Optional: force the component, e.g. mod_coursework. Blank = read from the plugin's own version.php."
        required: false
        type: string
        default: ""
      php-version:
        description: "PHP to boot. Leave as (default) to let the branch decide. Must be one the chosen Moodle accepts — 4.x takes 8.1-8.3, 5.x takes 8.2-8.4. An invalid pair is refused, not substituted."
        required: false
        type: choice
        default: "(default)"
        options:
          - "(default)"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
      login-as:
        description: "Who you arrive as. Leave as (default) to derive it from the landing page; pick a student to see the plugin as a learner."
        required: false
        type: choice
        default: "(default)"
        options:
          - "(default)"
          - admin
          - teacher
          # Only exists when "teachers" below is set to 2 — picking it otherwise
          # is refused with a reason, rather than building a link that dies at
          # its last step. ADDING an option breaks no saved `gh workflow run`
          # command; removing or renaming one gives 422.
          - teacher2
          - student1
          - student2
          - student3
      teachers:
        description: "Editing teachers in the review course. 0 signs you in as an administrator instead, which can open anything — so it is not what a teacher-less site looks like to a teacher."
        required: false
        type: choice
        # QUOTED. An unquoted 0 parses as the integer 0 for a `choice`, and the
        # form then vanishes from the Actions sidebar with no error anywhere.
        default: "1"
        options: ["0", "1", "2"]
      students:
        description: "Student accounts in the review course. Raise it for anything that lists, groups or grades people."
        required: false
        type: choice
        default: "1"
        options: ["1", "2", "3", "5", "10", "20"]
      sections:
        description: "Sections in the review course. No visible effect under the social format, which has no sections."
        required: false
        type: choice
        default: "3"
        options: ["1", "3", "5", "10"]
      course-format:
        description: "Course format for the review course. Leave as (default) for topics. Not for use when the plugin under review IS a course format — the preview already uses it."
        required: false
        type: choice
        default: "(default)"
        # QUOTED, all of them. Moodle does NOT validate a course format: an
        # unknown name is stored as typed and then rendered as an ordinary
        # topics course with nothing in the log, so a typo here would be
        # invisible. The builder refuses anything not on this list, and the
        # preview proves the format really took effect before you arrive.
        options: ["(default)", "topics", "weeks", "social", "singleactivity"]

# `contents: read`, not `{}`. The ref lookup calls `gh api` against a public
# repo, and with no scopes at all that call fails — proven by dispatching this
# workflow twice and watching both runs die before building anything. Nothing
# here writes.
permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Resolve whatever was typed to a SHA, so the link is pinned. A branch
      # link shows later commits and 404s once the branch is deleted — the
      # mutable pointer this whole design refuses. Done with `gh api`, not
      # `git ls-remote`, because ls-remote honours `--upload-pack=` and the ref
      # is typed by a human.
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.plugin-repo }}
          REF: ${{ inputs.plugin-ref }}
        run: |
          set -euo pipefail
          case "$REPO" in
            */*) : ;;
            *) echo "::error::plugin-repo must be owner/repo, got '$REPO'"; exit 1 ;;
          esac
          if [ -z "$REF" ]; then
            REF=$(gh api "repos/$REPO" --jq .default_branch)
            echo "::notice::no ref given; using the default branch $REF"
          fi
          # A full SHA resolves to itself; anything else is looked up.
          sha=$(gh api "repos/$REPO/commits/$REF" --jq .sha)
          # A counted glob of `?` is unreadable and was one short — 39 where 40
          # are needed — so it rejected every real SHA and the workflow could
          # never build a link. State the length instead of counting it.
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::could not resolve '$REF' in $REPO to a commit (got: ${sha:0:60})"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::$REPO@$REF -> $sha"

      - id: preview
        uses: ./preview
        with:
          head-repo: ${{ inputs.plugin-repo }}
          head-sha: ${{ steps.ref.outputs.sha }}
          moodle-branch: ${{ inputs.moodle-branch }}
          sample-content: ${{ inputs.sample-content }}
          restore-course-url: ${{ inputs.restore-course-url }}
          extra-plugins: ${{ inputs.extra-plugins }}
          theme: ${{ inputs.theme }}
          # Blank is meaningful, and NOT the same as omitting the key: an input
          # passed explicitly as "" stays "", so the action's own default never
          # applies. The builder reads an empty list as "use DEFAULT_DATA_HOSTS",
          # which is the same pair — one definition, in the script, rather than
          # a second copy of the list frozen into this form.
          data-hosts: ${{ inputs.data-hosts }}
          landing-path: ${{ inputs.landing-path }}
          plugin-component: ${{ inputs.plugin-component }}
          # The two sentinel options mean "leave it to the action", which is
          # not the same as an empty string a user typed — a `choice` has no
          # unset state, so the sentinel is how "unset" is expressed.
          php-version: ${{ inputs.php-version }}
          login-as: ${{ inputs.login-as }}
          teachers: ${{ inputs.teachers }}
          students: ${{ inputs.students }}
          sections: ${{ inputs.sections }}
          course-format: ${{ inputs.course-format }}
          # The only provenance a pasted link carries. Without it, a link built
          # here is shape-identical to one born from a push — and nothing here
          # booted anything.
          built-by: dispatch · ${{ github.actor }}
          # Nothing is checked out for the plugin, so version.php is fetched
          # over https from the pinned SHA. Point plugin-root at a subdirectory
          # only if the plugin does not sit at the repo root.
          plugin-root: "."
