# Run the gate in CI.
#
# Until this file existed, `verify.sh` ran NOWHERE except one laptop. The whole
# point of its 22 checks — the drift detectors especially — is to catch a
# FUTURE maintainer's mistake, and they caught nothing unless that maintainer
# happened to be the author sitting at the right machine. A panel found this by
# grepping the workflows and finding the only mention of verify.sh was a
# comment.
#
# Two jobs, deliberately split by what can make them red:
#
#   gate       offline + drift checks. Depends on this repo only. Blocking.
#              Its network checks (1f, 1h, 1p) WAIVE loudly when a host is
#              unreachable rather than failing, so an upstream outage does not
#              red an unrelated PR.
#
#   gate-live  boots the real playground in a browser (checks 4 and 5). This
#              CAN go red because someone else deployed something, which is
#              exactly why it must not gate a pull request. It runs on main,
#              on a schedule, and on demand. `canary.yml` already separates
#              "playground broke" from "our code broke"; this keeps that
#              distinction instead of collapsing it into the PR gate.

name: gate

on:
  push:
    # Every branch. A tags-only filter silently disables branch pushes — see
    # check 1i, which exists because we shipped exactly that once.
    branches: ["**"]
  pull_request:
  schedule:
    # Not 02:17 — canary.yml owns that slot.
    - cron: "41 3 * * *"
  workflow_dispatch: {}

# Read-only. Nothing here posts, comments, or writes.
permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: verify.sh (offline + drift, mutants ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Three jobs in parallel, each running the whole gate but only a third of
    # the mutants (MUTATIONS_SHARD). The mutation test is most of this job's
    # time and grows with every control; splitting it buys headroom for every
    # future control, where raising the cap buys one. Together the three
    # shards cover every mutant exactly once (test/shard.test.mjs).
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    # 40. The mutation harness runs the WHOLE unit suite once per mutant, so this
    # job grows with BOTH numbers at once and it grows fast. Measured, same job,
    # three consecutive controls:
    #
    #   before `teachers`        16m41s   (cap was 20 — a scheduled run was
    #                                      KILLED at 20m03s and reported no
    #                                      failing check, so it read as flake)
    #   after  `teachers`        17m48s   (494 tests, 320 mutants)
    #   after  `course-format`   22m29s   (494 tests, 336 mutants)
    #
    # Nearly five minutes for one control. Raised ahead of the next one rather
    # than after it: this project has already paid once for finding the ceiling
    # by hitting it, and a timeout kill is the least readable failure there is.
    # 60 since 2026-10-21 (David): headroom, whatever else is decided about
    # what this job runs.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # --ignore-scripts: check 1d pins the lockfile to the playwright tree, and
      # a lifecycle script would run code the lockfile check cannot see.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # No playground source here, so checks 1e and 1l waive themselves and the
      # tally names them. Deliberate: this job gates pull requests and must
      # depend on this repo only, or a playground commit could block an
      # unrelated PR. gate-live clones the playground source and runs both.
      - name: Run the gate
        env:
          MUTATIONS_SHARD: ${{ matrix.shard }}
        run: ./verify.sh

  gate-live:
    name: verify.sh (LIVE browser boot)
    # Never on pull_request: a red here can mean someone else's deploy broke,
    # and that must not block a contributor's PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 40, not 30. MEASURED on run 31994375185: this job took 23m36s against the
    # 30-minute cap, while the offline job took 17m48s — the LIVE job is the one
    # with less headroom, and it is the one every new browser arm lands in. A
    # timeout kill here would be hard to read: cancelled, naming no check.
    # 60 since 2026-10-21 (David): headroom, whatever else is decided about
    # what this job runs.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # Checks 1e and 1l compare the action against the playground's own source
      # (its plugin-directory map and the URL parameters it reads). A runner has
      # no sibling checkout, so without this they waived on every CI run. Shallow
      # clone of the deploy repo's default branch, outside the workspace so no
      # check that scans this repo sees it. Note this is the playground's latest
      # commit, which can differ from what the live host serves until it is
      # redeployed (scripts/check-host-version.mjs reports that nightly).
      # The repo is named owner/name, as playground-version.yml names it: a full
      # URL here would read to check 1j as a hardcoded playground host.
      - name: Clone the playground source for checks 1e and 1l
        env:
          PLAYGROUND_REPO: DavidUCL/moodle-playground
        run: |
          git clone --depth 1 --quiet "https://github.com/$PLAYGROUND_REPO" "$RUNNER_TEMP/moodle-playground"
          echo "playground source at $(git -C "$RUNNER_TEMP/moodle-playground" rev-parse --short HEAD)"

      # NSS_LIBS is the local-machine shim for a broken system NSS; a GitHub
      # runner has a working one, so it stays unset. verify.sh reads
      # LD_LIBRARY_PATH="${NSS_LIBS:-}", which is empty and harmless here.
      - name: Run the gate with LIVE checks
        env:
          LIVE: "1"
          PLAYGROUND_SRC: ${{ runner.temp }}/moodle-playground/src/blueprint/steps/moodle-plugins.js
          RESOLVER_SRC: ${{ runner.temp }}/moodle-playground/src/shared/version-resolver.js
        run: ./verify.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-live-evidence
          path: |
            /tmp/bv-verify-*.log
          if-no-files-found: ignore
          retention-days: 7
